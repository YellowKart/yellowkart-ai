quarkus.application.name=ai-service
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8007}
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-request-id
quarkus.http.cors.exposed-headers=x-request-id
quarkus.http.limits.max-body-size=15M

quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (%t) [req=%X{requestId}] %s%e%n
quarkus.log.category."com.yellowkart.ai.logging".level=DEBUG

# OpenAPI
quarkus.smallrye-openapi.info-title=YellowKart AI Suggestion API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Suggest construction products from image, camera, voice, or text

# OpenAI-first (Vision + Whisper). Set OPENAI_API_KEY for production.
# Without a key, stub mode keeps local demos/tests working.
ai.openai.api-key=${OPENAI_API_KEY:unset}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.vision-model=${OPENAI_VISION_MODEL:gpt-4o-mini}
ai.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
ai.openai.transcribe-model=${OPENAI_TRANSCRIBE_MODEL:whisper-1}
ai.stub.enabled=${AI_STUB_ENABLED:true}

ai.suggestions.limit=8
